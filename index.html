<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wells Bells</title>

<style>
:root{
  --blue:#155f99;
  --gold:#c89600;
  --lightblue:#dcecf8;
  --lightgold:#fff0bf;
  --bg:#f7f8fa;
  --text:#222;
  --muted:#5c6670;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:var(--blue);
  color:white;
  text-align:center;
  padding:20px 16px 14px;
  border-bottom:7px solid var(--gold);
}

header h1{
  margin:0;
  font-size:clamp(38px,7vw,70px);
  letter-spacing:2px;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  align-items:center;
  padding:14px;
  background:white;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:5;
}

button,select,input{
  font:inherit;
  padding:9px 12px;
  border:1px solid #aaa;
  border-radius:9px;
  background:white;
}

button{
  cursor:pointer;
  font-weight:700;
}

button.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

#minBtn.active{
  background:var(--gold);
  color:#111;
  border-color:var(--gold);
}

#testControls{
  display:none;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  justify-content:center;
}

#testControls.show{display:flex}

main{
  max-width:1000px;
  margin:0 auto;
  padding:24px 18px 40px;
}

.clock{
  text-align:center;
  margin-bottom:18px;
}

#clock{
  font-size:clamp(30px,5vw,48px);
  font-weight:800;
}

#scheduleLabel{
  font-weight:700;
  color:var(--muted);
  margin-top:4px;
}

.card{
  background:white;
  border-radius:18px;
  padding:28px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  text-align:center;
}

.status{
  font-size:clamp(42px,8vw,82px);
  font-weight:900;
  color:var(--blue);
  line-height:1.05;
}

.range{
  font-size:clamp(18px,3vw,28px);
  font-weight:700;
  color:#4e5863;
  margin-top:8px;
}

.remaining{
  margin-top:10px;
  font-size:18px;
  color:#5d6670;
}

.split{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.group{
  border-radius:16px;
  padding:22px 18px;
}

.group.a{background:var(--lightblue)}
.group.b{background:var(--lightgold)}

.group h2{
  margin:0 0 8px;
  font-size:22px;
}

.group .big{
  font-size:clamp(30px,5vw,54px);
  font-weight:900;
  line-height:1.05;
}

.group .small{
  margin-top:8px;
  font-weight:700;
  color:#4e5863;
}

.group .countdown{
  margin-top:8px;
  font-size:16px;
  color:#5d6670;
}

.next{
  margin-top:18px;
  padding:14px;
  background:#f0f2f4;
  border-radius:12px;
  font-weight:700;
  color:#4f5963;
}

.note{
  text-align:center;
  margin-top:14px;
  color:#6a737c;
  font-size:14px;
}

.hidden{display:none!important}

@media(max-width:700px){
  .split{grid-template-columns:1fr}
  .card{padding:20px 14px}
}
</style>
</head>

<body>

<header>
  <h1>WELLS BELLS</h1>
</header>

<div class="controls">
  <button id="autoBtn" class="active">Automatic</button>
  <button id="minBtn">Minimum Day</button>
  <button id="testBtn">Test Mode</button>

  <div id="testControls">
    <select id="testSchedule">
      <option value="regular">Regular Day</option>
      <option value="wednesday">Wednesday</option>
      <option value="minimum">Minimum Day</option>
    </select>

    <label>
      Time:
      <input id="testTime" type="time" value="11:30">
    </label>
  </div>
</div>

<main>

  <div class="clock">
    <div id="clock"></div>
    <div id="scheduleLabel"></div>
  </div>

  <div class="card">

    <div id="singleView">
      <div id="status" class="status"></div>
      <div id="timeRange" class="range"></div>
      <div id="remaining" class="remaining"></div>
    </div>

    <div id="splitView" class="hidden">

      <div class="split">

        <div class="group a">
          <h2>Lunch A Students</h2>
          <div id="group1Status" class="big"></div>
          <div id="group1Time" class="small"></div>
          <div id="group1Remaining" class="countdown"></div>
        </div>

        <div class="group b">
          <h2>Lunch B Students</h2>
          <div id="group2Status" class="big"></div>
          <div id="group2Time" class="small"></div>
          <div id="group2Remaining" class="countdown"></div>
        </div>

      </div>
    </div>

    <div id="next" class="next"></div>

  </div>

  <div class="note">
    Automatic mode uses the computer's current day and time. Wednesday switches automatically; use Minimum Day only when needed.
    <br><br>
    <strong>Created by C. Clinton</strong> &bull; Based on Wells Middle School's published bell schedule
  </div>

</main>

<!--
  IMPORTANT:
  schedule.js contains the bell schedule.
  For future school years, update schedule.js instead of this file.
-->
<script src="schedule.js"></script>

<script>

let mode = "auto";
let minimumOverride = false;

const $ = id => document.getElementById(id);

function toMin(time) {
  const [h,m] = time.split(":").map(Number);
  return h * 60 + m;
}

function pretty(time) {
  let [h,m] = time.split(":").map(Number);
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,"0")} ${ap}`;
}

function nowMin() {

  if (mode === "test") {
    return toMin(
      $("testTime").value || "11:30"
    );
  }

  const now = new Date();

  return (
    now.getHours() * 60 +
    now.getMinutes()
  );
}

function scheduleKey() {

  if (mode === "test") {
    return $("testSchedule").value;
  }

  if (minimumOverride) {
    return "minimum";
  }

  return new Date().getDay() === 3
    ? "wednesday"
    : "regular";
}

function clockText() {

  if (mode === "test") {
    return pretty(
      $("testTime").value || "11:30"
    );
  }

  return new Date().toLocaleTimeString(
    [],
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );
}

function nextEvent(events,t) {
  return (
    events.find(
      event => toMin(event.start) > t
    ) || null
  );
}

function minutesText(minutes) {
  return (
    `${minutes} minute` +
    `${minutes === 1 ? "" : "s"} remaining`
  );
}

function currentSplitItem(items,t) {

  return (
    items.find(
      item =>
        t >= toMin(item.start) &&
        t < toMin(item.end)
    ) || null
  );
}


function render() {

  const key = scheduleKey();
  const schedule = WELLS_SCHEDULES[key];
  const t = nowMin();

  $("clock").textContent = clockText();
  $("scheduleLabel").textContent = schedule.name;

  const active =
    schedule.events.find(
      event =>
        t >= toMin(event.start) &&
        t < toMin(event.end)
    ) || null;

  const first = schedule.events[0];
  const last =
    schedule.events[
      schedule.events.length - 1
    ];

  $("singleView")
    .classList
    .remove("hidden");

  $("splitView")
    .classList
    .add("hidden");


  /* SPLIT LUNCH / PERIOD 4 */

  if (
    active &&
    active.type === "split"
  ) {

    $("singleView")
      .classList
      .add("hidden");

    $("splitView")
      .classList
      .remove("hidden");

    const split = WELLS_SPLIT[key];

    const groupA =
      currentSplitItem(
        split.groupA,
        t
      );

    const groupB =
      currentSplitItem(
        split.groupB,
        t
      );

    if (groupA) {

      $("group1Status").textContent =
        groupA.label;

      $("group1Time").textContent =
        `${pretty(groupA.start)} – ${pretty(groupA.end)}`;

      $("group1Remaining").textContent =
        minutesText(
          toMin(groupA.end) - t
        );
    }

    if (groupB) {

      $("group2Status").textContent =
        groupB.label;

      $("group2Time").textContent =
        `${pretty(groupB.start)} – ${pretty(groupB.end)}`;

      $("group2Remaining").textContent =
        minutesText(
          toMin(groupB.end) - t
        );
    }

    const next =
      nextEvent(
        schedule.events,
        t
      );

    $("next").textContent =
      next
        ? `Next schoolwide: ${next.label} at ${pretty(next.start)}`
        : "";

    return;
  }


  /* ACTIVE PERIOD */

  if (active) {

    $("status").textContent =
      active.label;

    $("timeRange").textContent =
      `${pretty(active.start)} – ${pretty(active.end)}`;

    $("remaining").textContent =
      minutesText(
        toMin(active.end) - t
      );

    const next =
      nextEvent(
        schedule.events,
        t
      );

    $("next").textContent =
      next
        ? `Next: ${next.type === "split" ? "PERIOD 4 / LUNCH" : next.label} at ${pretty(next.start)}`
        : (
            key === "minimum"
              ? "Grab & Go lunch after dismissal"
              : "Last scheduled period of the day"
          );

    return;
  }


  /* BEFORE SCHOOL */

  if (
    t < toMin(first.start)
  ) {

    $("status").textContent =
      "BEFORE SCHOOL";

    $("timeRange").textContent =
      `Period 0 begins at ${pretty(first.start)}`;

    $("remaining").textContent =
      "";

    $("next").textContent =
      `Next: ${first.label} at ${pretty(first.start)}`;

    return;
  }


  /* AFTER SCHOOL */

  if (
    t >= toMin(last.end)
  ) {

    $("status").textContent =
      "SCHOOL DISMISSED";

    $("timeRange").textContent =
      key === "minimum"
        ? "Lunch: Grab & Go"
        : "";

    $("remaining").textContent =
      "";

    $("next").textContent =
      "";

    return;
  }


  /* PASSING PERIOD */

  const next =
    nextEvent(
      schedule.events,
      t
    );

  $("status").textContent =
    "PASSING PERIOD";

  $("timeRange").textContent =
    next
      ? `Next begins at ${pretty(next.start)}`
      : "";

  const minutesUntilNext =
    next
      ? toMin(next.start) - t
      : 0;

  $("remaining").textContent =
    next
      ? `${minutesUntilNext} minute${minutesUntilNext === 1 ? "" : "s"} until next period`
      : "";

  $("next").textContent =
    next
      ? `Next: ${next.type === "split" ? "PERIOD 4 / LUNCH" : next.label}`
      : "";
}


/* =====================================================
   BUTTONS
===================================================== */

$("autoBtn").onclick = () => {

  mode = "auto";
  minimumOverride = false;

  $("autoBtn")
    .classList
    .add("active");

  $("minBtn")
    .classList
    .remove("active");

  $("testBtn")
    .classList
    .remove("active");

  $("testControls")
    .classList
    .remove("show");

  render();
};


$("minBtn").onclick = () => {

  mode = "auto";

  minimumOverride =
    !minimumOverride;

  $("minBtn")
    .classList
    .toggle(
      "active",
      minimumOverride
    );

  $("autoBtn")
    .classList
    .toggle(
      "active",
      !minimumOverride
    );

  $("testBtn")
    .classList
    .remove("active");

  $("testControls")
    .classList
    .remove("show");

  render();
};


$("testBtn").onclick = () => {

  mode =
    mode === "test"
      ? "auto"
      : "test";

  const on =
    mode === "test";

  $("testBtn")
    .classList
    .toggle(
      "active",
      on
    );

  $("testControls")
    .classList
    .toggle(
      "show",
      on
    );

  $("autoBtn")
    .classList
    .toggle(
      "active",
      !on &&
      !minimumOverride
    );

  $("minBtn")
    .classList
    .toggle(
      "active",
      !on &&
      minimumOverride
    );

  render();
};


$("testSchedule").onchange =
  render;

$("testTime").oninput =
  render;

render();

setInterval(
  render,
  15000
);

</script>
</body>
</html>
