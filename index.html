<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wells Bells</title>
<style>
:root{--blue:#155f99;--gold:#c89600;--lightblue:#dcecf8;--lightgold:#fff0bf;--bg:#f7f8fa;--text:#222;--muted:#5c6670}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--blue);color:white;text-align:center;padding:20px 16px 14px;border-bottom:7px solid var(--gold)}
header h1{margin:0;font-size:clamp(38px,7vw,70px);letter-spacing:2px}
header p{margin:6px 0 0;font-size:18px}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding:14px;background:white;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
button,select,input{font:inherit;padding:9px 12px;border:1px solid #aaa;border-radius:9px;background:white}
button{cursor:pointer;font-weight:700}
button.active{background:var(--blue);color:white;border-color:var(--blue)}
#minBtn.active{background:var(--gold);border-color:var(--gold);color:#111}
#testControls{display:none;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
#testControls.show{display:flex}
main{max-width:1000px;margin:0 auto;padding:24px 18px 40px}
.clock{text-align:center;margin-bottom:18px}
#clock{font-size:clamp(30px,5vw,48px);font-weight:800}
#scheduleLabel{font-weight:700;color:var(--muted);margin-top:4px}
.card{background:white;border-radius:18px;padding:28px;box-shadow:0 5px 20px rgba(0,0,0,.08);text-align:center}
.status{font-size:clamp(42px,8vw,82px);font-weight:900;color:var(--blue);line-height:1.05}
.range{font-size:clamp(18px,3vw,28px);font-weight:700;color:#4e5863;margin-top:8px}
.remaining{margin-top:10px;font-size:18px;color:#5d6670}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.group{border-radius:16px;padding:22px 18px}
.group.a{background:var(--lightblue)}
.group.b{background:var(--lightgold)}
.group h2{margin:0 0 8px;font-size:22px}
.group .big{font-size:clamp(30px,5vw,54px);font-weight:900;line-height:1.05}
.group .small{margin-top:8px;font-weight:700;color:#4e5863}
.next{margin-top:18px;padding:14px;background:#f0f2f4;border-radius:12px;font-weight:700;color:#4f5963}
.note{text-align:center;margin-top:14px;color:#6a737c;font-size:14px}
.hidden{display:none!important}
@media(max-width:700px){.split{grid-template-columns:1fr}.card{padding:20px 14px}}
</style>
</head>
<body>
<header><h1>WELLS BELLS</h1><p>2026–2027</p></header>

<div class="controls">
  <button id="autoBtn" class="active">Automatic</button>
  <button id="minBtn">Minimum Day</button>
  <button id="testBtn">Test Mode</button>
  <div id="testControls">
    <select id="testSchedule">
      <option value="regular">Regular Day</option>
      <option value="wednesday">Wednesday</option>
      <option value="minimum">Minimum Day</option>
    </select>
    <label>Time: <input id="testTime" type="time" value="11:30"></label>
  </div>
</div>

<main>
  <div class="clock"><div id="clock"></div><div id="scheduleLabel"></div></div>

  <div class="card">
    <div id="singleView">
      <div id="status" class="status"></div>
      <div id="timeRange" class="range"></div>
      <div id="remaining" class="remaining"></div>
    </div>

    <div id="splitView" class="hidden">
      <div class="split">
        <div class="group a">
          <h2>Lunch A Students</h2>
          <div id="group1Status" class="big"></div>
          <div id="group1Time" class="small"></div>
        </div>
        <div class="group b">
          <h2>Lunch B Students</h2>
          <div id="group2Status" class="big"></div>
          <div id="group2Time" class="small"></div>
        </div>
      </div>
      <div id="splitRemaining" class="remaining"></div>
    </div>

    <div id="next" class="next"></div>
  </div>

  <div class="note">
    Automatic mode uses the computer's current day and time. Wednesday switches automatically; use Minimum Day only when needed.
    <br><br><strong>Created by C. Clinton</strong> &bull; Based on Wells Middle School's published 2026&ndash;27 bell schedule
  </div>
</main>

<script>
const schedules={
  regular:{name:"Regular Day",events:[
    {start:"07:40",end:"08:30",label:"PERIOD 0"},
    {start:"08:35",end:"09:25",label:"PERIOD 1"},
    {start:"09:29",end:"10:19",label:"PERIOD 2"},
    {start:"10:23",end:"10:48",label:"ADVISORY / ACADEMIC PREP"},
    {start:"10:48",end:"10:55",label:"NUTRITION BREAK"},
    {start:"10:59",end:"11:49",label:"PERIOD 3"},
    {start:"11:49",end:"13:17",type:"split"},
    {start:"13:21",end:"14:11",label:"PERIOD 5"},
    {start:"14:15",end:"15:05",label:"PERIOD 6"}
  ]},
  wednesday:{name:"Wednesday",events:[
    {start:"07:45",end:"08:30",label:"PERIOD 0"},
    {start:"08:35",end:"09:23",label:"PERIOD 1"},
    {start:"09:27",end:"10:10",label:"PERIOD 2"},
    {start:"10:10",end:"10:17",label:"NUTRITION BREAK"},
    {start:"10:21",end:"11:04",label:"PERIOD 3"},
    {start:"11:04",end:"12:26",type:"split"},
    {start:"12:30",end:"13:13",label:"PERIOD 5"},
    {start:"13:17",end:"14:00",label:"PERIOD 6"}
  ]},
  minimum:{name:"Minimum Day",events:[
    {start:"08:05",end:"08:30",label:"PERIOD 0"},
    {start:"08:35",end:"09:07",label:"PERIOD 1"},
    {start:"09:11",end:"09:41",label:"PERIOD 2"},
    {start:"09:45",end:"10:15",label:"PERIOD 3"},
    {start:"10:22",end:"10:52",label:"PERIOD 4"},
    {start:"10:56",end:"11:26",label:"PERIOD 5"},
    {start:"11:30",end:"12:00",label:"PERIOD 6"}
  ]}
};

let mode="auto",minimumOverride=false;
const $=id=>document.getElementById(id);

function toMin(t){const [h,m]=t.split(":").map(Number);return h*60+m}
function pretty(t){
  let [h,m]=t.split(":").map(Number);
  const ap=h>=12?"PM":"AM";
  h=h%12||12;
  return `${h}:${String(m).padStart(2,"0")} ${ap}`;
}
function nowMin(){
  if(mode==="test")return toMin($("testTime").value||"11:30");
  const d=new Date();
  return d.getHours()*60+d.getMinutes();
}
function scheduleKey(){
  if(mode==="test")return $("testSchedule").value;
  if(minimumOverride)return "minimum";
  return new Date().getDay()===3?"wednesday":"regular";
}
function clockText(){
  if(mode==="test")return pretty($("testTime").value||"11:30");
  return new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
}
function nextEvent(events,t){return events.find(ev=>toMin(ev.start)>t)||null}

function splitState(key,t){
  let a,atime,b,btime,end;
  if(key==="regular"){
    end=toMin("13:17");
    if(t<toMin("12:23")){
      a="LUNCH A"; atime="11:49 AM – 12:23 PM";
    }else if(t<toMin("12:27")){
      a="PASSING PERIOD"; atime="12:23 PM – 12:27 PM";
    }else{
      a="PERIOD 4"; atime="12:27 PM – 1:17 PM";
    }

    if(t<toMin("11:53")){
      b="PASSING PERIOD"; btime="11:49 AM – 11:53 AM";
    }else if(t<toMin("12:43")){
      b="PERIOD 4"; btime="11:53 AM – 12:43 PM";
    }else{
      b="LUNCH B"; btime="12:43 PM – 1:17 PM";
    }
  }else{
    end=toMin("12:26");
    if(t<toMin("11:39")){
      a="LUNCH A"; atime="11:04 AM – 11:39 AM";
    }else if(t<toMin("11:43")){
      a="PASSING PERIOD"; atime="11:39 AM – 11:43 AM";
    }else{
      a="PERIOD 4"; atime="11:43 AM – 12:26 PM";
    }

    if(t<toMin("11:08")){
      b="PASSING PERIOD"; btime="11:04 AM – 11:08 AM";
    }else if(t<toMin("11:51")){
      b="PERIOD 4"; btime="11:08 AM – 11:51 AM";
    }else{
      b="LUNCH B"; btime="11:51 AM – 12:26 PM";
    }
  }
  return {g1:a,g1time:atime,g2:b,g2time:btime,end};
}

function render(){
  const key=scheduleKey(),sched=schedules[key],t=nowMin();
  $("clock").textContent=clockText();
  $("scheduleLabel").textContent=sched.name;

  const active=sched.events.find(ev=>t>=toMin(ev.start)&&t<toMin(ev.end))||null;
  const first=sched.events[0],last=sched.events[sched.events.length-1];

  $("singleView").classList.remove("hidden");
  $("splitView").classList.add("hidden");

  if(active&&active.type==="split"){
    $("singleView").classList.add("hidden");
    $("splitView").classList.remove("hidden");
    const s=splitState(key,t);
    $("group1Status").textContent=s.g1;
    $("group1Time").textContent=s.g1time;
    $("group2Status").textContent=s.g2;
    $("group2Time").textContent=s.g2time;
    $("splitRemaining").textContent=`${s.end-t} minutes until the Period 4/lunch block ends`;
    const n=nextEvent(sched.events,t);
    $("next").textContent=n?`Next: ${n.label} at ${pretty(n.start)}`:"";
    return;
  }

  if(active){
    $("status").textContent=active.label;
    $("timeRange").textContent=`${pretty(active.start)} – ${pretty(active.end)}`;
    $("remaining").textContent=`${toMin(active.end)-t} minutes remaining`;
    const n=nextEvent(sched.events,t);
    $("next").textContent=n
      ?`Next: ${n.type==="split"?"PERIOD 4 / LUNCH":n.label} at ${pretty(n.start)}`
      :(key==="minimum"?"Grab & Go lunch after dismissal":"Last scheduled period of the day");
    return;
  }

  if(t<toMin(first.start)){
    $("status").textContent="BEFORE SCHOOL";
    $("timeRange").textContent=`Period 0 begins at ${pretty(first.start)}`;
    $("remaining").textContent="";
    $("next").textContent=`Next: ${first.label} at ${pretty(first.start)}`;
    return;
  }

  if(t>=toMin(last.end)){
    $("status").textContent="SCHOOL DISMISSED";
    $("timeRange").textContent=key==="minimum"?"Lunch: Grab & Go":"";
    $("remaining").textContent="";
    $("next").textContent="";
    return;
  }

  const n=nextEvent(sched.events,t);
  $("status").textContent="PASSING PERIOD";
  $("timeRange").textContent=n?`Next begins at ${pretty(n.start)}`:"";
  $("remaining").textContent=n?`${toMin(n.start)-t} minutes until next period`:"";
  $("next").textContent=n?`Next: ${n.type==="split"?"PERIOD 4 / LUNCH":n.label}`:"";
}

$("autoBtn").onclick=()=>{
  mode="auto";minimumOverride=false;
  $("autoBtn").classList.add("active");
  $("minBtn").classList.remove("active");
  $("testBtn").classList.remove("active");
  $("testControls").classList.remove("show");
  render();
};
$("minBtn").onclick=()=>{
  mode="auto";minimumOverride=!minimumOverride;
  $("minBtn").classList.toggle("active",minimumOverride);
  $("autoBtn").classList.toggle("active",!minimumOverride);
  $("testBtn").classList.remove("active");
  $("testControls").classList.remove("show");
  render();
};
$("testBtn").onclick=()=>{
  mode=mode==="test"?"auto":"test";
  const on=mode==="test";
  $("testBtn").classList.toggle("active",on);
  $("testControls").classList.toggle("show",on);
  $("autoBtn").classList.toggle("active",!on&&!minimumOverride);
  $("minBtn").classList.toggle("active",!on&&minimumOverride);
  render();
};

$("testSchedule").onchange=render;
$("testTime").oninput=render;
render();
setInterval(render,15000);
</script>
</body>
</html>
